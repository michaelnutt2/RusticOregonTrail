name: Rust CI

on:
    push:
        branches: ["trunk"]
    pull_request:
        branches: ["trunk"]

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3

        - name: Check formatting
          run: cargo fmt -- --check

        - name: Check for warnings (Clippy)
          run: cargo clippy -- -D warnings

        - name: Run tests
          run: cargo test --verbose